[project]
name = "extreme-forecast-tool"
version = "0.1.0"
description = "Configurable extremes forecasting tool: downscaled ensemble precipitation forecasts vs. observational climatology, for Ethiopia and beyond."
requires-python = ">=3.11"
dependencies = [
    "xarray>=2024.1",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "netCDF4>=1.6",
    "rioxarray>=0.15",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "xclim>=0.48",
    "dask>=2024.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "scikit-learn>=1.3",
    "apscheduler>=3.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
verification = ["xskillscore>=0.0.24", "properscoring>=0.1"]
regridding = ["xesmf>=0.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
